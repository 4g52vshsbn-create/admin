<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест по административному праву</title>
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f2f7;--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.85);--stroke:rgba(255,255,255,.9);--line:rgba(60,60,67,.14);--text:#1c1c1e;--muted:#6e6e73;--blue:#007aff;--green:#34c759;--red:#ff3b30;--shadow:0 8px 32px rgba(31,38,135,.10),0 1px 0 rgba(255,255,255,.9) inset}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 12% 8%,rgba(120,170,255,.55),transparent 70%),radial-gradient(480px 400px at 92% 18%,rgba(255,160,200,.50),transparent 70%),radial-gradient(560px 460px at 70% 95%,rgba(170,140,255,.40),transparent 70%),radial-gradient(420px 360px at 5% 90%,rgba(120,225,200,.40),transparent 70%)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,#5ac8fa,#007aff);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(0,122,255,.35)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--stroke);border-radius:28px;padding:26px;box-shadow:var(--shadow)}
h1{font-size:clamp(30px,6vw,40px);line-height:1.1;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}
h2{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;font-size:16px}
.grad{color:var(--blue)}
label.f{display:block;font-weight:500;font-size:13px;color:var(--muted);margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:var(--glass2);color:var(--text);outline:none;transition:box-shadow .15s,border-color .15s}
input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.18)}
.btn{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:16px;padding:15px 22px;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 6px 18px rgba(0,122,255,.30);transition:transform .12s,opacity .15s,background .15s}
.btn:hover{background:#0a84ff}.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:var(--glass2);color:var(--blue);border:1px solid var(--stroke);box-shadow:0 2px 10px rgba(0,0,0,.06);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.row .btn{flex:1 1 180px}
.stats{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.chip{background:var(--glass2);border:1px solid var(--stroke);border-radius:99px;padding:7px 14px;font-size:14px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.bar{height:6px;background:rgba(60,60,67,.12);border-radius:99px;overflow:hidden;margin:0 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:20px}
.q{font-size:clamp(19px,3.8vw,23px);font-weight:600;letter-spacing:-.01em;margin:0 0 8px}
.hint{font-size:14px;color:var(--muted);margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;background:var(--glass2);border:1px solid var(--stroke);border-radius:18px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:background .15s,border-color .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.mk{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid rgba(60,60,67,.3);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;transition:all .15s}
.opt.multi .mk{border-radius:8px}
.opt.sel{background:rgba(0,122,255,.12);border-color:rgba(0,122,255,.55)}
.opt.sel .mk{background:var(--blue);border-color:var(--blue)}.opt.sel .mk::after{content:"✓"}
.opt.ok{background:rgba(52,199,89,.16);border-color:rgba(52,199,89,.7)}.opt.ok .mk{background:var(--green);border-color:var(--green)}.opt.ok .mk::after{content:"✓"}
.opt.bad{background:rgba(255,59,48,.12);border-color:rgba(255,59,48,.6)}.opt.bad .mk{background:var(--red);border-color:var(--red)}.opt.bad .mk::after{content:"✕"}
.opt.miss{border:1.5px dashed var(--green)}
.locked .opt{cursor:default}
.verdict{margin-top:14px;padding:14px 18px;border-radius:18px;font-weight:600}
.verdict.ok{background:rgba(52,199,89,.16);color:#1f8f3d}.verdict.bad{background:rgba(255,59,48,.12);color:#d70015}
.verdict small{display:block;font-weight:400;color:var(--text);margin-top:4px}
.score{font-size:68px;font-weight:700;line-height:1;margin:6px 0;letter-spacing:-.03em}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line)}
td{padding:13px 8px;border-bottom:1px solid var(--line)}
tr.me td{background:rgba(0,122,255,.10)}
tr.me td:first-child{border-radius:12px 0 0 12px}tr.me td:last-child{border-radius:0 12px 12px 0}
.scroll{overflow-x:auto}
.wl{margin:14px 0 0;padding:0;list-style:none}
.wl li{padding:12px 14px;background:var(--glass2);border:1px solid var(--stroke);border-radius:16px;margin-bottom:8px;font-size:14px}
.wl b{color:#1f8f3d;font-weight:600}
.icon{background:var(--glass2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--stroke);color:var(--text);border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:17px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.link{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;margin-top:12px;padding:0;font-weight:500}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo">⚖</span><span>Админправо</span></div>
    <div style="display:flex;gap:8px"><button class="icon" id="bRate" title="Рейтинг">🏆</button></div>
  </div>

  <section id="home" class="card">
    <h1>Тест по <span class="grad">административному праву</span></h1>
    <p class="sub">Проходи сколько хочешь: вопросы и варианты каждый раз перемешиваются, после каждого ответа показывается верный. Без таймера.</p>
    <label class="f" for="name">Твоё имя</label>
    <input type="text" id="name" maxlength="30" placeholder="Например, Анна" autocomplete="off">
    <div class="stats" id="myStats"></div>
    <div class="row">
      <button class="btn" id="bStart" disabled>Начать тест</button>
      <button class="btn ghost" id="bMist" hidden></button>
    </div>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="bar"><i id="pb"></i></div>
    <div class="meta"><span id="cnt"></span><span id="sc"></span></div>
    <p class="q" id="qt"></p>
    <p class="hint" id="qh"></p>
    <div id="ans"></div>
    <div id="vd"></div>
    <div class="row"><button class="btn" id="bOk" disabled>Ответить</button><button class="btn" id="bNext" hidden>Далее</button></div>
  </section>

  <section id="res" class="card" hidden>
    <div class="sub" style="margin:0" id="rWho"></div>
    <div class="score grad" id="rScore"></div>
    <p class="sub" id="rMsg"></p>
    <div id="rWrong"></div>
    <div class="row">
      <button class="btn" id="bAgain">Пройти ещё раз</button>
      <button class="btn ghost" id="bMist2" hidden></button>
      <button class="btn ghost" id="bRate2">Рейтинг</button>
    </div>
  </section>

  <section id="rate" class="card" hidden>
    <h2>🏆 Рейтинг</h2>
    <div class="scroll" id="rt"></div>
    <p class="sub" style="margin:14px 0 0;font-size:13px">Рейтинг хранится в браузере на этом устройстве. В рейтинг идут только полные прохождения.</p>
    <div class="row"><button class="btn ghost" id="bBack">Назад</button></div>
  </section>
</div>
<script>

власти субъекта Российской Федерации", "Правительство Российской Федерации", "Президент Российской Федерации", "Федеральная налоговая служба Российской Федерации", "высшее должностное лицо субъекта РФ"], "c": [3]}]}, {"q": "Систему органов исполнительной власти Свердловской области возглавляет", "type": "single", "variants": [{"o": ["Администрация Губернатора Свердловской области", "Правительство Свердловской области", "Губернатор Свердловской области", "Полномочный представитель Президента Российской Федерации в Уральском федеральном округе"], "c": [1]}]}, {"q": "Способность в силу норм права нести ответственность за совершение административных правонарушений называется", "type": "text", "answer": "административная деликтоспособность", "rx": "деликтоспособн"}, {"q": "Регулирование численности временно проживающих на территории Российской Федерации иностранных граждан и лиц без гражданства осуществляется посредством", "type": "single", "variants": [{"o": ["квот, утверждаемых высшими должностными лицами субъектов Российской Федерации", "квот, утверждаемых Правительством Российской Федерации", "квот, утверждаемых Министерством внутренних дел Российской Федерации", "квот, утверждаемых Президентом Российской Федерации"], "c": [1]}]}, {"q": "Субъектами административной опеки являются", "type": "single", "variants": [{"o": ["лица, получающие трудовые пенсии", "несовершеннолетние", "больные туберкулезом", "государственные служащие"], "c": [1]}]}, {"q": "Примером общей административной жалобы является жалоба гражданина", "type": "single", "variants": [{"o": ["на бездействие государственного служащего", "в вышестоящий административный орган на постановление по делу об административном правонарушении", "водителю автобуса на нарушение пассажиром прав пользования общественным транспортом", "директору кафе на незаконные действия официанта"], "c": [0]}]}, {"q": "Орган, функционирующий исключительно на коллегиальной основе, является", "type": "single", "variants": [{"o": ["федерал const $=s=>document.querySelector(s),mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
const norm=s=>s.toLowerCase().replace(/ё/g,'е').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>{['home','quiz','res','rate'].forEach(x=>$('#'+x).hidden=x!==id);window.scrollTo(0,0)};
const key=()=>norm($('#name').value).replace(/\s+/g,' ');
const label=()=>$('#name').value.trim().replace(/\s+/g,' ');
let S=null;


/* главная */
function refresh(){
  const k=key(),has=k.length>0;$('#bStart').disabled=!has;
  const r=store.get('rating',{})[k],m=store.get('mist',{})[k]||[];
  $('#myStats').innerHTML=has&&r?`<span class="chip">Попыток: <b>${r.attempts}</b></span><span class="chip">Лучший: <b>${r.best}/${r.total}</b></span><span class="chip">Последний: <b>${r.last}/${r.total}</b></span>`:'';
  const b=$('#bMist');b.hidden=!(has&&m.length);b.textContent='Работа над ошибками ('+m.length+')';
}
$('#name').addEventListener('input',refresh);
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter'&&key())start('all')});
$('#name').value=store.get('lastName','');refresh();

/* тест */
function build(id){
  const d=DATA[id];
  if(d.type==='text')return{id,type:'text',q:d.q,answer:d.answer,rx:new RegExp(d.rx,'i')};
  const v=d.variants[Math.random()*d.variants.length|0];
  const opts=shuffle(v.o.map((t,i)=>({t,ok:v.c.includes(i)})));
  return{id,type:d.type,q:d.q,opts};
}
function start(mode){
  const k=key();if(!k)return;
  store.set('lastName',label());
  let ids=DATA.map((_,i)=>i);
  if(mode==='mist'){const m=store.get('mist',{})[k]||[];ids=m.length?m:ids}
  S={mode,k,name:label(),list:shuffle(ids).map(build),i:0,score:0,wrong:[],fixed:[]};
  show('quiz');render();
}
function render(){
  const q=S.list[S.i],n=S.list.length;S.done=false;
  $('#cnt').textContent=`Вопрос ${S.i+1} из ${n}`;$('#sc').textContent=`Баллы: ${S.score}`;
  $('#pb').style.width=(S.i/n*100)+'%';$('#qt').textContent=q.q;
  $('#vd').innerHTML='';$('#bOk').hidden=false;$('#bOk').disabled=true;$('#bNext').hidden=true;
  const box=$('#ans');box.className='';box.innerHTML='';
  if(q.type==='text'){
    $('#qh').textContent='Впиши ответ своими словами';
    box.innerHTML='<input type="text" id="tx" placeholder="Твой ответ" autocomplete="off">';
    const tx=$('#tx');tx.oninput=()=>$('#bOk').disabled=!tx.value.trim();
    tx.onkeydown=e=>{if(e.key==='Enter'&&!$('#bOk').disabled)check()};setTimeout(()=>tx.focus(),50);
  }else{
    const multi=q.type==='multi';
    $('#qh').textContent=multi?'Отметь все верные варианты':'Выбери один вариант';
    q.opts.forEach((o,i)=>{
      const l=document.createElement('label');l.className='opt'+(multi?' multi':'');
      l.innerHTML=`<input type="${multi?'checkbox':'radio'}" name="o"><span class="mk"></span><span></span>`;
      l.lastChild.textContent=o.t;
      l.querySelector('input').onchange=()=>{
        if(!multi)box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        l.classList.toggle('sel',l.querySelector('input').checked);
        $('#bOk').disabled=!box.querySelector('input:checked');
      };
      box.appendChild(l);
    });
  }
}
function verdict(ok,extra){
  $('#vd').innerHTML=`<div class="verdict ${ok?'ok':'bad'}">${ok?'Верно! 🎉':'Неверно'}${extra?`<small>${extra}</small>`:''}</div>`;
}
function check(){
  const q=S.list[S.i];if(S.done)return;S.done=true;let ok;
  if(q.type==='text'){
    const v=norm($('#tx').value);ok=q.rx.test(v);$('#tx').disabled=true;
    if(ok)verdict(true,'');
    else{verdict(false,'Правильный ответ: <b></b>');$('#vd small b').textContent=q.answer;
      const b=document.createElement('button');b.className='link';b.textContent='Я ответил верно, засчитать';
      b.onclick=()=>{S.score++;S.wrong=S.wrong.filter(x=>x!==q.id);S.fixed.push(q.id);$('#sc').textContent=`Баллы: ${S.score}`;verdict(true,'Засчитано вручную');};
      $('#vd').appendChild(b);}
  }else{
    const ls=[...$('#ans').querySelectorAll('.opt')];ok=true;
    ls.forEach((l,i)=>{const sel=l.querySelector('input').checked,c=q.opts[i].ok;
      if(sel!==c)ok=false;
      l.querySelector('input').disabled=true;l.classList.remove('sel');
      if(sel&&c)l.classList.add('ok');else if(sel&&!c)l.classList.add('bad');else if(!sel&&c)l.classList.add('miss');});
    $('#ans').classList.add('locked');verdict(ok,'');
  }
  if(ok)S.score++;else S.wrong.push(q.id);
  $('#sc').textContent=`Баллы: ${S.score}`;
  $('#bOk').hidden=true;$('#bNext').hidden=false;
  $('#bNext').textContent=S.i===S.list.length-1?'Завершить':'Далее';$('#bNext').focus();
}
$('#bOk').onclick=check;
$('#bNext').onclick=()=>{S.i++;S.i<S.list.length?render():finish()};

function finish(){
  const n=S.list.length,pct=Math.round(S.score/n*100);
  const M=store.get('mist',{});
  if(S.mode==='all'){
    M[S.k]=S.wrong.slice();
    const R=store.get('rating',{}),r=R[S.k]||{name:S.name,attempts:0,best:0,sum:0,total:n};
    r.name=S.name;r.attempts++;r.last=S.score;r.best=Math.max(r.best,S.score);r.sum+=S.score;r.total=n;r.ts=Date.now();R[S.k]=r;store.set('rating',R);
  }else{
    const left=(M[S.k]||[]).filter(id=>S.wrong.includes(id));M[S.k]=left;
  }
  store.set('mist',M);
  $('#rWho').textContent=S.name+(S.mode==='mist'?' · работа над ошибками':'');
  $('#rScore').textContent=`${S.score} / ${n}`;
  $('#rMsg').textContent=pct===100?'Идеально! Ни одной ошибки.':pct>=80?`Отлично: ${pct}%. Ещё чуть-чуть до идеала.`:pct>=60?`Неплохо: ${pct}%. Разбери ошибки ниже и пройди ещё раз.`:`${pct}%. Не страшно, с каждым разом будет лучше.`;
  const w=$('#rWrong');w.innerHTML='';
  if(S.wrong.length){
    w.innerHTML='<h2 style="margin:18px 0 0;font-size:18px">Где были ошибки</h2><ul class="wl"></ul>';
    S.wrong.forEach(id=>{const d=DATA[id],li=document.createElement('li');
      const ans=d.type==='text'?d.answer:d.variants[0].c.map(i=>d.variants[0].o[i]).join('; ');
      li.innerHTML='<span></span><br><b></b>';li.firstChild.textContent=d.q;li.lastChild.textContent='Ответ: '+ans;w.querySelector('ul').appendChild(li);});
  }
  const left=M[S.k]||[],b=$('#bMist2');b.hidden=!left.length;b.textContent='Работа над ошибками ('+left.length+')';
  show('res');refresh();
}
$('#bStart').onclick=()=>start('all');
$('#bMist').onclick=()=>start('mist');
$('#bMist2').onclick=()=>start('mist');
$('#bAgain').onclick=()=>start('all');

/* рейтинг */
function rating(){
  const R=Object.entries(store.get('rating',{})).map(([k,r])=>({k,...r})).sort((a,b)=>b.best-a.best||a.attempts-b.attempts);
  const t=$('#rt');
  if(!R.length){t.innerHTML='<p class="sub">Пока никто не прошёл тест целиком. Будь первым!</p>';return}
  t.innerHTML='<table><thead><tr><th>#</th><th>Имя</th><th>Попыток</th><th>Лучший</th><th>Последний</th><th>Средний</th></tr></thead><tbody></tbody></table>';
  const me=key(),tb=t.querySelector('tbody');
  R.forEach((r,i)=>{const tr=document.createElement('tr');if(r.k===me)tr.className='me';
    tr.innerHTML=`<td>${['🥇','🥈','🥉'][i]||i+1}</td><td></td><td>${r.attempts}</td><td><b>${r.best}/${r.total}</b></td><td>${r.last}/${r.total}</td><td>${(r.sum/r.attempts).toFixed(1)}</td>`;
    tr.children[1].textContent=r.name;tb.appendChild(tr);});
}
const openRate=()=>{rating();show('rate')};
$('#bRate').onclick=openRate;$('#bRate2').onclick=openRate;
$('#bBack').onclick=()=>{refresh();show('home')};
</script>
</body>
</html>
